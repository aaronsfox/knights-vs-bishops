# maia: settings for the Maia-3 strength-ladder rungs (code/maia_runner.py).
#
# Rungs and model size are open decisions (analysis plan): confirm Maia-3's
# supported rating range, its own/opponent rating conditioning and its
# licence in the repository before fixing them. Moves are sampled from the
# policy at `temperature`, so repeated games from a book line differ.

[match]
games_per_line = 10
seed = 1999

[adjudication]
# A Stockfish check after every move: both sides' scores (White's view)
# beyond resign_cp for resign_moves moves each ends the game; a draw at the
# move cap. Tablebases ("" for none) adjudicate small endgames exactly.
engine = "stockfish"
nodes = 20_000
resign_cp = 1000
resign_moves = 5
max_moves = 200
tablebases = ""
tbpieces = 6

[players.maia3_1100]
policy = "maia3"
model = "79M"
rating = 1100
temperature = 1.0

[players.maia3_1500]
policy = "maia3"
model = "79M"
rating = 1500
temperature = 1.0

[players.maia3_1900]
policy = "maia3"
model = "79M"
rating = 1900
temperature = 1.0

# A UCI engine through the same runner, for testing it end to end.
[players.runner_test]
policy = "uci"
engine = "stockfish"
nodes = 1_000
