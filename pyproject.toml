[project]
name = "knights-vs-bishops"
version = "0.1.0"
description = "Are bishops worth more than knights? Human games, biased engines and engine self-play"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "zstandard>=0.22",
]

[project.optional-dependencies]
# Figures (code/plot_boards.py and the analysis figures); cairosvg needs the cairo library.
figures = ["matplotlib>=3.8", "cairosvg>=2.7"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# The code/ folder holds scripts, not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
